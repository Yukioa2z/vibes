name: Notify Website

on:
  push:
    branches: [main]
    paths:
      - 'skills/vibe/vibes/**/vibe.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger vibing-supply rebuild
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.WEBSITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Yukioa2z/vibing-supply/dispatches \
            -d '{"event_type": "vibes-updated"}'
