name: publish

# Push a version tag (e.g. v0.1.2) → CI publishes that version to npm.
# Cut a release with:  npm version patch && git push --follow-tags
#
# Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN. The npm
# package must have this repo + workflow registered as a trusted
# publisher (npmjs.com → package → Settings → Trusted Publisher).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1; setup-node ships older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Guard: the git tag must equal the package.json version, so a
      # mistagged push can't publish the wrong version.
      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($PKG)" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
